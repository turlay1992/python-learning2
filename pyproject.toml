[project]
name = "python-learning2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roman Turlai", email = "roman.turlai@trinetix.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
python-learning2 = "python_learning2:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/python_learning2/exceptions/examples.py" = ["T20"]
"src/python_learning2/__init__.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
